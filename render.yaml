# Render "Blueprint": creates the web app + a PostgreSQL database in one go.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
#
# NOTE: Render's FREE Postgres expires 30 days after creation. For real patient
# data use a paid plan (change `plan` below) or a permanent hosted database
# (then delete the `databases:` block and set DATABASE_URL yourself).
databases:
  - name: renalcare-db
    plan: free
    databaseName: renalcare
    user: renalcare

services:
  - type: web
    name: renalcare
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: renalcare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD      # the 'admin' login password (see Environment tab after deploy)
        generateValue: true
      - key: SEED_DEMO           # "true" adds demo users with publicly known passwords – keep false for real use
        value: "false"
